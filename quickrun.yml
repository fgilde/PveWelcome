# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: PveWelcome
description: "The Proxmox welcome page."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  - run: dotnet restore

tasks:
  - name: app
    run: dotnet run --project . --urls http://localhost:5083
    readyWhen: {http: "http://localhost:5083"}
    open: true
